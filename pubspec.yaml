name: xedu
description: "xEdu 跨平台教育应用（平板 / 手机），Flutter 实现。"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.3
  video_player: ^2.9.2
  audioplayers: ^6.8.1
  file_picker: ^13.0.0
  android_file_picker: ^2.0.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/courses.json
    - assets/data/qa_questions.json
    - assets/data/qa_voice.json
    - assets/audio/
    # 目录声明不递归，问答语音在子目录里得单独列一行。
    - assets/audio/qa/
